externalId: tr_energy_base_raw_InspectionRecommendation_relations
name: RAW → InspectionRecommendation relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: InspectionRecommendation
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`assetExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`assetSpace`), trim(`assetExternalId`))\
  \ END AS `asset`\n  , CASE WHEN coalesce(trim(`loopExternalId`), '') = '' THEN NULL\
  \ ELSE node_reference(trim(`loopSpace`), trim(`loopExternalId`)) END AS `loop`\n\
  FROM `energy_dm_base_demo`.`InspectionRecommendation`\n"
