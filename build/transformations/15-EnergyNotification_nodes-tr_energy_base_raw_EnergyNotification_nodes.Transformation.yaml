externalId: tr_energy_base_raw_EnergyNotification_nodes
name: RAW → EnergyNotification nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyNotification
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , from_json(CASE WHEN typeof(`aliasesJson`)\
  \ = 'string' THEN trim(cast(`aliasesJson` AS STRING)) ELSE trim(to_json(`aliasesJson`))\
  \ END, 'ARRAY<STRING>') AS `aliases`\n  , cast(`changedBy` AS STRING) AS `changedBy`\n\
  \  , CASE WHEN `changedDate` IS NOT NULL AND trim(cast(`changedDate` AS STRING))\
  \ != '' THEN to_timestamp(`changedDate`) ELSE NULL END AS `changedDate`\n  , cast(`changedTime`\
  \ AS STRING) AS `changedTime`\n  , CASE WHEN `completionDate` IS NOT NULL AND trim(cast(`completionDate`\
  \ AS STRING)) != '' THEN to_timestamp(`completionDate`) ELSE NULL END AS `completionDate`\n\
  \  , cast(`completionTime` AS STRING) AS `completionTime`\n  , cast(`costCenter`\
  \ AS STRING) AS `costCenter`\n  , cast(`createdBy` AS STRING) AS `createdBy`\n \
  \ , CASE WHEN `createdDate` IS NOT NULL AND trim(cast(`createdDate` AS STRING))\
  \ != '' THEN to_timestamp(`createdDate`) ELSE NULL END AS `createdDate`\n  , cast(`description`\
  \ AS STRING) AS `description`\n  , cast(`detectionMethod` AS STRING) AS `detectionMethod`\n\
  \  , cast(`equipmentNumber` AS STRING) AS `equipmentNumber`\n  , cast(`failureEffect`\
  \ AS STRING) AS `failureEffect`\n  , cast(`failureImpactOnHSE` AS STRING) AS `failureImpactOnHSE`\n\
  \  , cast(`failureImpactOnOperations` AS STRING) AS `failureImpactOnOperations`\n\
  \  , cast(`functionalLocation` AS STRING) AS `functionalLocation`\n  , cast(`maintenancePlant`\
  \ AS STRING) AS `maintenancePlant`\n  , cast(`name` AS STRING) AS `name`\n  , cast(`notificationCategory`\
  \ AS STRING) AS `notificationCategory`\n  , cast(`notificationCategoryDescription`\
  \ AS STRING) AS `notificationCategoryDescription`\n  , cast(`notificationCreatedTime`\
  \ AS STRING) AS `notificationCreatedTime`\n  , cast(`notificationLongText` AS STRING)\
  \ AS `notificationLongText`\n  , cast(`notificationNumber` AS STRING) AS `notificationNumber`\n\
  \  , cast(`notificationShortText` AS STRING) AS `notificationShortText`\n  , cast(`notificationSubcategory`\
  \ AS STRING) AS `notificationSubcategory`\n  , cast(`notificationSubcategoryDescription`\
  \ AS STRING) AS `notificationSubcategoryDescription`\n  , cast(`notificationText`\
  \ AS STRING) AS `notificationText`\n  , cast(`notificationType` AS STRING) AS `notificationType`\n\
  \  , cast(`notificationTypeDescription` AS STRING) AS `notificationTypeDescription`\n\
  \  , cast(`objectNumber` AS STRING) AS `objectNumber`\n  , cast(`objectNumberCategory`\
  \ AS STRING) AS `objectNumberCategory`\n  , cast(`objectNumberCategoryDescription`\
  \ AS STRING) AS `objectNumberCategoryDescription`\n  , cast(`objectNumberDescription`\
  \ AS STRING) AS `objectNumberDescription`\n  , cast(`objectNumberSubcategory` AS\
  \ STRING) AS `objectNumberSubcategory`\n  , cast(`objectNumberSubcategoryDescription`\
  \ AS STRING) AS `objectNumberSubcategoryDescription`\n  , cast(`objectNumberType`\
  \ AS STRING) AS `objectNumberType`\n  , cast(`objectNumberTypeDescription` AS STRING)\
  \ AS `objectNumberTypeDescription`\n  , cast(`objectType` AS STRING) AS `objectType`\n\
  \  , cast(`objectTypeDescription` AS STRING) AS `objectTypeDescription`\n  , cast(`operatingConditionAtFailure`\
  \ AS STRING) AS `operatingConditionAtFailure`\n  , cast(`plannerGroup` AS STRING)\
  \ AS `plannerGroup`\n  , cast(`planningPlant` AS STRING) AS `planningPlant`\n  ,\
  \ cast(`plant` AS STRING) AS `plant`\n  , cast(`priority` AS STRING) AS `priority`\n\
  \  , cast(`reportedBy` AS STRING) AS `reportedBy`\n  , CASE WHEN `reportedDate`\
  \ IS NOT NULL AND trim(cast(`reportedDate` AS STRING)) != '' THEN to_timestamp(`reportedDate`)\
  \ ELSE NULL END AS `reportedDate`\n  , cast(`reportedTime` AS STRING) AS `reportedTime`\n\
  \  , cast(`scheduledStartTime` AS STRING) AS `scheduledStartTime`\n  , CASE WHEN\
  \ `settlementDate` IS NOT NULL AND trim(cast(`settlementDate` AS STRING)) != ''\
  \ THEN to_timestamp(`settlementDate`) ELSE NULL END AS `settlementDate`\n  , cast(`settlementRule`\
  \ AS STRING) AS `settlementRule`\n  , cast(`settlementRuleCategory` AS STRING) AS\
  \ `settlementRuleCategory`\n  , cast(`settlementRuleCategoryDescription` AS STRING)\
  \ AS `settlementRuleCategoryDescription`\n  , cast(`settlementRuleDescription` AS\
  \ STRING) AS `settlementRuleDescription`\n  , cast(`settlementRuleSubcategory` AS\
  \ STRING) AS `settlementRuleSubcategory`\n  , cast(`settlementRuleSubcategoryDescription`\
  \ AS STRING) AS `settlementRuleSubcategoryDescription`\n  , cast(`settlementRuleType`\
  \ AS STRING) AS `settlementRuleType`\n  , cast(`settlementRuleTypeDescription` AS\
  \ STRING) AS `settlementRuleTypeDescription`\n  , cast(`settlementTime` AS STRING)\
  \ AS `settlementTime`\n  , cast(`sourceContext` AS STRING) AS `sourceContext`\n\
  \  , cast(`sourceCreatedTime` AS STRING) AS `sourceCreatedTime`\n  , cast(`sourceCreatedUser`\
  \ AS STRING) AS `sourceCreatedUser`\n  , cast(`sourceId` AS STRING) AS `sourceId`\n\
  \  , cast(`sourceUpdatedTime` AS STRING) AS `sourceUpdatedTime`\n  , cast(`sourceUpdatedUser`\
  \ AS STRING) AS `sourceUpdatedUser`\n  , cast(`startTime` AS STRING) AS `startTime`\n\
  \  , cast(`status` AS STRING) AS `status`\n  , cast(`systemStatus` AS STRING) AS\
  \ `systemStatus`\n  , from_json(CASE WHEN typeof(`tagsJson`) = 'string' THEN trim(cast(`tagsJson`\
  \ AS STRING)) ELSE trim(to_json(`tagsJson`)) END, 'ARRAY<STRING>') AS `tags`\n \
  \ , CASE WHEN `technicalCompletionDate` IS NOT NULL AND trim(cast(`technicalCompletionDate`\
  \ AS STRING)) != '' THEN to_timestamp(`technicalCompletionDate`) ELSE NULL END AS\
  \ `technicalCompletionDate`\n  , cast(`technicalCompletionTime` AS STRING) AS `technicalCompletionTime`\n\
  \  , cast(`type` AS STRING) AS `type`\n  , cast(`userStatus` AS STRING) AS `userStatus`\n\
  \  , cast(`workCenter` AS STRING) AS `workCenter`\nFROM `energy_dm_base_demo`.`EnergyNotification`\n"
