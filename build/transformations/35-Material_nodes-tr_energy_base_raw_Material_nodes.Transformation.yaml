externalId: tr_energy_base_raw_Material_nodes
name: RAW → Material nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: Material
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , cast(`coated` AS BOOLEAN) AS `coated`\n\
  \  , CASE WHEN `cuiPeakMaxC` IS NOT NULL AND trim(cast(`cuiPeakMaxC` AS STRING))\
  \ != '' THEN cast(`cuiPeakMaxC` AS DOUBLE) ELSE NULL END AS `cuiPeakMaxC`\n  , CASE\
  \ WHEN `cuiPeakMinC` IS NOT NULL AND trim(cast(`cuiPeakMinC` AS STRING)) != '' THEN\
  \ cast(`cuiPeakMinC` AS DOUBLE) ELSE NULL END AS `cuiPeakMinC`\n  , CASE WHEN `cuiSusceptibilityMaxC`\
  \ IS NOT NULL AND trim(cast(`cuiSusceptibilityMaxC` AS STRING)) != '' THEN cast(`cuiSusceptibilityMaxC`\
  \ AS DOUBLE) ELSE NULL END AS `cuiSusceptibilityMaxC`\n  , CASE WHEN `cuiSusceptibilityMinC`\
  \ IS NOT NULL AND trim(cast(`cuiSusceptibilityMinC` AS STRING)) != '' THEN cast(`cuiSusceptibilityMinC`\
  \ AS DOUBLE) ELSE NULL END AS `cuiSusceptibilityMinC`\n  , cast(`description` AS\
  \ STRING) AS `description`\n  , cast(`name` AS STRING) AS `name`\nFROM `energy_dm_base_demo`.`Material`\n"
