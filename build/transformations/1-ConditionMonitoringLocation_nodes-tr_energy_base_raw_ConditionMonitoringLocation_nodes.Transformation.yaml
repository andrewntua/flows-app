externalId: tr_energy_base_raw_ConditionMonitoringLocation_nodes
name: RAW → ConditionMonitoringLocation nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: ConditionMonitoringLocation
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , CASE WHEN `axialFraction` IS NOT NULL\
  \ AND trim(cast(`axialFraction` AS STRING)) != '' THEN cast(`axialFraction` AS DOUBLE)\
  \ ELSE NULL END AS `axialFraction`\n  , CASE WHEN `cadNodeId` IS NOT NULL AND trim(cast(`cadNodeId`\
  \ AS STRING)) != '' THEN cast(`cadNodeId` AS LONG) ELSE NULL END AS `cadNodeId`\n\
  \  , cast(`clockPosition` AS STRING) AS `clockPosition`\n  , cast(`cmlId` AS STRING)\
  \ AS `cmlId`\n  , cast(`componentType` AS STRING) AS `componentType`\n  , cast(`description`\
  \ AS STRING) AS `description`\n  , CASE WHEN `modelId` IS NOT NULL AND trim(cast(`modelId`\
  \ AS STRING)) != '' THEN cast(`modelId` AS LONG) ELSE NULL END AS `modelId`\n  ,\
  \ cast(`name` AS STRING) AS `name`\n  , CASE WHEN `nominalThicknessMm` IS NOT NULL\
  \ AND trim(cast(`nominalThicknessMm` AS STRING)) != '' THEN cast(`nominalThicknessMm`\
  \ AS DOUBLE) ELSE NULL END AS `nominalThicknessMm`\n  , CASE WHEN `positionX` IS\
  \ NOT NULL AND trim(cast(`positionX` AS STRING)) != '' THEN cast(`positionX` AS\
  \ DOUBLE) ELSE NULL END AS `positionX`\n  , CASE WHEN `positionY` IS NOT NULL AND\
  \ trim(cast(`positionY` AS STRING)) != '' THEN cast(`positionY` AS DOUBLE) ELSE\
  \ NULL END AS `positionY`\n  , CASE WHEN `positionZ` IS NOT NULL AND trim(cast(`positionZ`\
  \ AS STRING)) != '' THEN cast(`positionZ` AS DOUBLE) ELSE NULL END AS `positionZ`\n\
  \  , CASE WHEN `revisionId` IS NOT NULL AND trim(cast(`revisionId` AS STRING)) !=\
  \ '' THEN cast(`revisionId` AS LONG) ELSE NULL END AS `revisionId`\n  , CASE WHEN\
  \ `tminMm` IS NOT NULL AND trim(cast(`tminMm` AS STRING)) != '' THEN cast(`tminMm`\
  \ AS DOUBLE) ELSE NULL END AS `tminMm`\nFROM `energy_dm_base_demo`.`ConditionMonitoringLocation`\n"
