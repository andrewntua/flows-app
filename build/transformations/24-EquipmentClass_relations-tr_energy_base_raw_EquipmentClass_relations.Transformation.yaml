externalId: tr_energy_base_raw_EquipmentClass_relations
name: RAW → EquipmentClass relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EquipmentClass
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN size(CASE WHEN coalesce(trim(`failureModesExternalIds`),\
  \ '') != '' THEN filter(transform(split(`failureModesExternalIds`, '\\\\|'), x ->\
  \ node_reference(trim(`failureModesSpace`), trim(x))), r -> r.externalId is not\
  \ null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`failureModesJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`failureModesExternalIds`), '') != '' THEN filter(transform(split(`failureModesExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`failureModesSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`failureModesJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `failureModes`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`name` AS STRING)\
  \ AS `name`\nFROM `energy_dm_base_demo`.`EquipmentClass`\n"
