  \  , cast(`mainWorkCenter` AS STRING) AS `mainWorkCenter`\n  , cast(`mainWorkCenterDesc`\
  \ AS STRING) AS `mainWorkCenterDesc`\n  , cast(`maintenancePlant` AS STRING) AS\
  \ `maintenancePlant`\n  , cast(`maintenancePlantDesc` AS STRING) AS `maintenancePlantDesc`\n\
  \  , cast(`name` AS STRING) AS `name`\n  , cast(`objectNumber` AS STRING) AS `objectNumber`\n\
  \  , cast(`objectType` AS STRING) AS `objectType`\n  , cast(`objectTypeDesc` AS\
