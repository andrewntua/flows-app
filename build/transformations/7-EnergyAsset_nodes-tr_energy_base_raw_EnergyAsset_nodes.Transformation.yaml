  \ AS `sourceDb`\n  , cast(`sourceId` AS STRING) AS `sourceId`\n  , cast(`sourceTable`\
  \ AS STRING) AS `sourceTable`\n  , cast(`subFunctionCode` AS STRING) AS `subFunctionCode`\n\
  \  , cast(`subFunctionDesc` AS STRING) AS `subFunctionDesc`\n  , cast(`superiorFuncLocationTagDesc`\
  \ AS STRING) AS `superiorFuncLocationTagDesc`\n  , cast(`superiorFunctionalLocation`\
  \ AS STRING) AS `superiorFunctionalLocation`\n  , cast(`systemDesc` AS STRING) AS\
  \ `systemDesc`\n  , cast(`systemId` AS STRING) AS `systemId`\n  , cast(`systemStatus`\
  \ AS STRING) AS `systemStatus`\n  , cast(`tagComment` AS STRING) AS `tagComment`\n\
  \  , cast(`tagCreatedDate` AS STRING) AS `tagCreatedDate`\n  , cast(`tagCriticalLine`\
