  \  , cast(`rbaConsequenceProduction` AS STRING) AS `rbaConsequenceProduction`\n\
  \  , cast(`rbaConsequenceSafety` AS STRING) AS `rbaConsequenceSafety`\n  , cast(`rbaProbability`\
  \ AS STRING) AS `rbaProbability`\n  , cast(`rbaRisk` AS STRING) AS `rbaRisk`\n \
