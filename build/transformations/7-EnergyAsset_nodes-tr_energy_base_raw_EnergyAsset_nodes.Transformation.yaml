  \ AS `aliases`\n  , cast(`areaId` AS STRING) AS `areaId`\n  , cast(`barrierArea`\
  \ AS STRING) AS `barrierArea`\n  , cast(`barrierElementPrimary` AS STRING) AS `barrierElementPrimary`\n\
  \  , cast(`barrierElementSecondary` AS STRING) AS `barrierElementSecondary`\n  ,\
  \ cast(`barrierElementTertiary` AS STRING) AS `barrierElementTertiary`\n  , cast(`catalogProfile`\
  \ AS STRING) AS `catalogProfile`\n  , cast(`catalogProfileDesc` AS STRING) AS `catalogProfileDesc`\n\
  \  , cast(`category` AS STRING) AS `category`\n  , cast(`categoryId` AS STRING)\
  \ AS `categoryId`\n  , cast(`contractorId` AS STRING) AS `contractorId`\n  , cast(`createdDate`\
  \ AS STRING) AS `createdDate`\n  , cast(`criticalityCombined` AS STRING) AS `criticalityCombined`\n\
  \  , cast(`criticalityCost` AS STRING) AS `criticalityCost`\n  , cast(`criticalityEnvironment`\
  \ AS STRING) AS `criticalityEnvironment`\n  , cast(`criticalityProduction` AS STRING)\
  \ AS `criticalityProduction`\n  , cast(`criticalitySafety` AS STRING) AS `criticalitySafety`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`discipline` AS STRING)\
