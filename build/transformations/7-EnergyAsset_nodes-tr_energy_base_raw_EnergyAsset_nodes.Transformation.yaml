  \  , cast(`functionalLocationDesc` AS STRING) AS `functionalLocationDesc`\n  , cast(`groupDesc`\
  \ AS STRING) AS `groupDesc`\n  , cast(`groupId` AS STRING) AS `groupId`\n  , cast(`inspCritCombined`\
  \ AS STRING) AS `inspCritCombined`\n  , cast(`inspCritCost` AS STRING) AS `inspCritCost`\n\
  \  , cast(`inspCritEnvironment` AS STRING) AS `inspCritEnvironment`\n  , cast(`inspCritSafety`\
