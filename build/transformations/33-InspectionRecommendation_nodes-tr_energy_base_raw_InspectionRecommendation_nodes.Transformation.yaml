externalId: tr_energy_base_raw_InspectionRecommendation_nodes
name: RAW → InspectionRecommendation nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: InspectionRecommendation
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , CASE WHEN `cost` IS NOT NULL AND trim(cast(`cost`\
  \ AS STRING)) != '' THEN cast(`cost` AS LONG) ELSE NULL END AS `cost`\n  , cast(`costUnit`\
  \ AS STRING) AS `costUnit`\n  , CASE WHEN `coverage` IS NOT NULL AND trim(cast(`coverage`\
  \ AS STRING)) != '' THEN cast(`coverage` AS DOUBLE) ELSE NULL END AS `coverage`\n\
  \  , cast(`currentRisk` AS STRING) AS `currentRisk`\n  , cast(`futureRisk` AS STRING)\
  \ AS `futureRisk`\n  , cast(`inspectionEffectiveness` AS STRING) AS `inspectionEffectiveness`\n\
  \  , CASE WHEN `latestDeadline` IS NOT NULL AND trim(cast(`latestDeadline` AS STRING))\
  \ != '' THEN to_timestamp(`latestDeadline`) ELSE NULL END AS `latestDeadline`\n\
  \  , cast(`ndeMethod` AS STRING) AS `ndeMethod`\n  , cast(`timeframe` AS STRING)\
  \ AS `timeframe`\nFROM `energy_dm_base_demo`.`InspectionRecommendation`\n"
