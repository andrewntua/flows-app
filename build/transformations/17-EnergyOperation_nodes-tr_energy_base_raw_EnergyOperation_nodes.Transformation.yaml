externalId: tr_energy_base_raw_EnergyOperation_nodes
name: RAW → EnergyOperation nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyOperation
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , cast(`activityType` AS STRING) AS\
  \ `activityType`\n  , cast(`activityTypeDescription` AS STRING) AS `activityTypeDescription`\n\
  \  , CASE WHEN `actualCosts` IS NOT NULL AND trim(cast(`actualCosts` AS STRING))\
  \ != '' THEN cast(`actualCosts` AS DOUBLE) ELSE NULL END AS `actualCosts`\n  , CASE\
  \ WHEN `actualFinishDate` IS NOT NULL AND trim(cast(`actualFinishDate` AS STRING))\
  \ != '' THEN to_timestamp(`actualFinishDate`) ELSE NULL END AS `actualFinishDate`\n\
  \  , CASE WHEN `actualStartDate` IS NOT NULL AND trim(cast(`actualStartDate` AS\
  \ STRING)) != '' THEN to_timestamp(`actualStartDate`) ELSE NULL END AS `actualStartDate`\n\
  \  , CASE WHEN `actualWorkHours` IS NOT NULL AND trim(cast(`actualWorkHours` AS\
  \ STRING)) != '' THEN cast(`actualWorkHours` AS DOUBLE) ELSE NULL END AS `actualWorkHours`\n\
  \  , from_json(CASE WHEN typeof(`aliasesJson`) = 'string' THEN trim(cast(`aliasesJson`\
  \ AS STRING)) ELSE trim(to_json(`aliasesJson`)) END, 'ARRAY<STRING>') AS `aliases`\n\
  \  , CASE WHEN `basicFinishDate` IS NOT NULL AND trim(cast(`basicFinishDate` AS\
  \ STRING)) != '' THEN to_timestamp(`basicFinishDate`) ELSE NULL END AS `basicFinishDate`\n\
  \  , CASE WHEN `basicStartDate` IS NOT NULL AND trim(cast(`basicStartDate` AS STRING))\
  \ != '' THEN to_timestamp(`basicStartDate`) ELSE NULL END AS `basicStartDate`\n\
  \  , cast(`controlKey` AS STRING) AS `controlKey`\n  , cast(`controlKeyDescription`\
  \ AS STRING) AS `controlKeyDescription`\n  , cast(`costCenter` AS STRING) AS `costCenter`\n\
  \  , cast(`currency` AS STRING) AS `currency`\n  , cast(`description` AS STRING)\
  \ AS `description`\n  , cast(`endTime` AS STRING) AS `endTime`\n  , cast(`equipmentNumber`\
  \ AS STRING) AS `equipmentNumber`\n  , cast(`functionalLocation` AS STRING) AS `functionalLocation`\n\
  \  , cast(`maintenancePlant` AS STRING) AS `maintenancePlant`\n  , CASE WHEN `materialCost`\
  \ IS NOT NULL AND trim(cast(`materialCost` AS STRING)) != '' THEN cast(`materialCost`\
  \ AS DOUBLE) ELSE NULL END AS `materialCost`\n  , cast(`materialDescription` AS\
  \ STRING) AS `materialDescription`\n  , cast(`materialNumber` AS STRING) AS `materialNumber`\n\
  \  , CASE WHEN `materialQuantity` IS NOT NULL AND trim(cast(`materialQuantity` AS\
  \ STRING)) != '' THEN cast(`materialQuantity` AS DOUBLE) ELSE NULL END AS `materialQuantity`\n\
  \  , cast(`materialUnit` AS STRING) AS `materialUnit`\n  , cast(`name` AS STRING)\
  \ AS `name`\n  , cast(`operationCategory` AS STRING) AS `operationCategory`\n  ,\
  \ cast(`operationLongText` AS STRING) AS `operationLongText`\n  , cast(`operationNumber`\
  \ AS STRING) AS `operationNumber`\n  , cast(`operationSubcategory` AS STRING) AS\
  \ `operationSubcategory`\n  , cast(`operationText` AS STRING) AS `operationText`\n\
  \  , cast(`operationType` AS STRING) AS `operationType`\n  , CASE WHEN `plannedCosts`\
  \ IS NOT NULL AND trim(cast(`plannedCosts` AS STRING)) != '' THEN cast(`plannedCosts`\
  \ AS DOUBLE) ELSE NULL END AS `plannedCosts`\n  , CASE WHEN `plannedWorkHours` IS\
  \ NOT NULL AND trim(cast(`plannedWorkHours` AS STRING)) != '' THEN cast(`plannedWorkHours`\
  \ AS DOUBLE) ELSE NULL END AS `plannedWorkHours`\n  , cast(`plannerGroup` AS STRING)\
  \ AS `plannerGroup`\n  , cast(`planningPlant` AS STRING) AS `planningPlant`\n  ,\
  \ cast(`plant` AS STRING) AS `plant`\n  , CASE WHEN `priority` IS NOT NULL AND trim(cast(`priority`\
  \ AS STRING)) != '' THEN cast(`priority` AS LONG) ELSE NULL END AS `priority`\n\
  \  , cast(`priorityDescription` AS STRING) AS `priorityDescription`\n  , cast(`scheduledEndTime`\
  \ AS STRING) AS `scheduledEndTime`\n  , CASE WHEN `scheduledFinishDate` IS NOT NULL\
  \ AND trim(cast(`scheduledFinishDate` AS STRING)) != '' THEN to_timestamp(`scheduledFinishDate`)\
  \ ELSE NULL END AS `scheduledFinishDate`\n  , CASE WHEN `scheduledStartDate` IS\
  \ NOT NULL AND trim(cast(`scheduledStartDate` AS STRING)) != '' THEN to_timestamp(`scheduledStartDate`)\
  \ ELSE NULL END AS `scheduledStartDate`\n  , cast(`scheduledStartTime` AS STRING)\
  \ AS `scheduledStartTime`\n  , cast(`sourceContext` AS STRING) AS `sourceContext`\n\
  \  , cast(`sourceCreatedTime` AS STRING) AS `sourceCreatedTime`\n  , cast(`sourceCreatedUser`\
  \ AS STRING) AS `sourceCreatedUser`\n  , cast(`sourceId` AS STRING) AS `sourceId`\n\
  \  , cast(`sourceUpdatedTime` AS STRING) AS `sourceUpdatedTime`\n  , cast(`sourceUpdatedUser`\
  \ AS STRING) AS `sourceUpdatedUser`\n  , cast(`startTime` AS STRING) AS `startTime`\n\
  \  , cast(`status` AS STRING) AS `status`\n  , CASE WHEN `suggestedScheduledFinishDate`\
  \ IS NOT NULL AND trim(cast(`suggestedScheduledFinishDate` AS STRING)) != '' THEN\
  \ to_timestamp(`suggestedScheduledFinishDate`) ELSE NULL END AS `suggestedScheduledFinishDate`\n\
  \  , CASE WHEN `suggestedScheduledStartDate` IS NOT NULL AND trim(cast(`suggestedScheduledStartDate`\
  \ AS STRING)) != '' THEN to_timestamp(`suggestedScheduledStartDate`) ELSE NULL END\
  \ AS `suggestedScheduledStartDate`\n  , cast(`systemStatus` AS STRING) AS `systemStatus`\n\
  \  , from_json(CASE WHEN typeof(`tagsJson`) = 'string' THEN trim(cast(`tagsJson`\
  \ AS STRING)) ELSE trim(to_json(`tagsJson`)) END, 'ARRAY<STRING>') AS `tags`\n \
  \ , cast(`userStatus` AS STRING) AS `userStatus`\n  , cast(`workCenter` AS STRING)\
  \ AS `workCenter`\n  , CASE WHEN `workCenterCapacity` IS NOT NULL AND trim(cast(`workCenterCapacity`\
  \ AS STRING)) != '' THEN cast(`workCenterCapacity` AS DOUBLE) ELSE NULL END AS `workCenterCapacity`\n\
  \  , CASE WHEN `workCenterCapacityActual` IS NOT NULL AND trim(cast(`workCenterCapacityActual`\
  \ AS STRING)) != '' THEN cast(`workCenterCapacityActual` AS DOUBLE) ELSE NULL END\
  \ AS `workCenterCapacityActual`\n  , CASE WHEN `workCenterCapacityActualFinish`\
  \ IS NOT NULL AND trim(cast(`workCenterCapacityActualFinish` AS STRING)) != '' THEN\
  \ to_timestamp(`workCenterCapacityActualFinish`) ELSE NULL END AS `workCenterCapacityActualFinish`\n\
  \  , CASE WHEN `workCenterCapacityActualStart` IS NOT NULL AND trim(cast(`workCenterCapacityActualStart`\
  \ AS STRING)) != '' THEN to_timestamp(`workCenterCapacityActualStart`) ELSE NULL\
  \ END AS `workCenterCapacityActualStart`\n  , cast(`workCenterCapacityActualUnit`\
  \ AS STRING) AS `workCenterCapacityActualUnit`\n  , CASE WHEN `workCenterCapacityPlanned`\
  \ IS NOT NULL AND trim(cast(`workCenterCapacityPlanned` AS STRING)) != '' THEN cast(`workCenterCapacityPlanned`\
  \ AS DOUBLE) ELSE NULL END AS `workCenterCapacityPlanned`\n  , CASE WHEN `workCenterCapacityPlannedFinish`\
  \ IS NOT NULL AND trim(cast(`workCenterCapacityPlannedFinish` AS STRING)) != ''\
  \ THEN to_timestamp(`workCenterCapacityPlannedFinish`) ELSE NULL END AS `workCenterCapacityPlannedFinish`\n\
  \  , CASE WHEN `workCenterCapacityPlannedStart` IS NOT NULL AND trim(cast(`workCenterCapacityPlannedStart`\
  \ AS STRING)) != '' THEN to_timestamp(`workCenterCapacityPlannedStart`) ELSE NULL\
  \ END AS `workCenterCapacityPlannedStart`\n  , cast(`workCenterCapacityPlannedUnit`\
  \ AS STRING) AS `workCenterCapacityPlannedUnit`\n  , CASE WHEN `workCenterCapacityRequirement`\
  \ IS NOT NULL AND trim(cast(`workCenterCapacityRequirement` AS STRING)) != '' THEN\
  \ cast(`workCenterCapacityRequirement` AS DOUBLE) ELSE NULL END AS `workCenterCapacityRequirement`\n\
  \  , CASE WHEN `workCenterCapacityRequirementFinish` IS NOT NULL AND trim(cast(`workCenterCapacityRequirementFinish`\
  \ AS STRING)) != '' THEN to_timestamp(`workCenterCapacityRequirementFinish`) ELSE\
  \ NULL END AS `workCenterCapacityRequirementFinish`\n  , CASE WHEN `workCenterCapacityRequirementStart`\
  \ IS NOT NULL AND trim(cast(`workCenterCapacityRequirementStart` AS STRING)) !=\
  \ '' THEN to_timestamp(`workCenterCapacityRequirementStart`) ELSE NULL END AS `workCenterCapacityRequirementStart`\n\
  \  , cast(`workCenterCapacityRequirementUnit` AS STRING) AS `workCenterCapacityRequirementUnit`\n\
  \  , cast(`workCenterCapacityUnit` AS STRING) AS `workCenterCapacityUnit`\n  , cast(`workCenterResponsible`\
  \ AS STRING) AS `workCenterResponsible`\nFROM `energy_dm_base_demo`.`EnergyOperation`\n"
