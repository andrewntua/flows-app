externalId: tr_energy_base_raw_EnergyAsset_relations
name: RAW → EnergyAsset relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyAsset
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`parentExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`parentSpace`), trim(`parentExternalId`))\
  \ END AS `parent`\n  , cast(`description` AS STRING) AS `description`\n  , cast(`name`\
  \ AS STRING) AS `name`\n  , cast(`sourceContext` AS STRING) AS `sourceContext`\n\
  \  , cast(`sourceId` AS STRING) AS `sourceId`\nFROM `energy_dm_base_demo`.`EnergyAsset`\n"
