externalId: tr_energy_base_raw_WallThicknessMeasuringPoint_relations
name: RAW → WallThicknessMeasuringPoint relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: WallThicknessMeasuringPoint
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`conditionMonitoringLocationExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`conditionMonitoringLocationSpace`),\
  \ trim(`conditionMonitoringLocationExternalId`)) END AS `conditionMonitoringLocation`\n\
  \  , CASE WHEN `inspectionDate` IS NOT NULL AND trim(cast(`inspectionDate` AS STRING))\
  \ != '' THEN to_timestamp(`inspectionDate`) ELSE NULL END AS `inspectionDate`\n\
  \  , CASE WHEN `measuredThicknessMm` IS NOT NULL AND trim(cast(`measuredThicknessMm`\
  \ AS STRING)) != '' THEN cast(`measuredThicknessMm` AS DOUBLE) ELSE NULL END AS\
  \ `measuredThicknessMm`\nFROM `energy_dm_base_demo`.`WallThicknessMeasuringPoint`\n"
