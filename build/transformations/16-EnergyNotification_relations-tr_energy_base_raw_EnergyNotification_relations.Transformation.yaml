externalId: tr_energy_base_raw_EnergyNotification_relations
name: RAW → EnergyNotification relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyNotification
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`assetExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`assetSpace`), trim(`assetExternalId`))\
  \ END AS `asset`\n  , CASE WHEN size(CASE WHEN coalesce(trim(`equipmentExternalIds`),\
  \ '') != '' THEN filter(transform(split(`equipmentExternalIds`, '\\\\|'), x -> node_reference(trim(`equipmentSpace`),\
  \ trim(x))), r -> r.externalId is not null AND length(trim(r.externalId)) > 0) ELSE\
  \ filter(transform(filter(from_json(coalesce(nullif(trim(cast(`equipmentJson` AS\
  \ STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'), x ->\
  \ x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`equipmentExternalIds`), '') != '' THEN filter(transform(split(`equipmentExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`equipmentSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`equipmentJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `equipment`\n\
  \  , CASE WHEN coalesce(trim(`failureCauseExternalId`), '') = '' THEN NULL ELSE\
  \ node_reference(trim(`failureCauseSpace`), trim(`failureCauseExternalId`)) END\
  \ AS `failureCause`\n  , CASE WHEN coalesce(trim(`failureMechanismExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`failureMechanismSpace`), trim(`failureMechanismExternalId`))\
  \ END AS `failureMechanism`\n  , CASE WHEN coalesce(trim(`failureModeExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`failureModeSpace`), trim(`failureModeExternalId`))\
  \ END AS `failureMode`\n  , CASE WHEN coalesce(trim(`maintenanceOrderExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`maintenanceOrderSpace`), trim(`maintenanceOrderExternalId`))\
  \ END AS `maintenanceOrder`\n  , cast(`description` AS STRING) AS `description`\n\
  \  , cast(`name` AS STRING) AS `name`\n  , cast(`priority` AS STRING) AS `priority`\n\
  \  , cast(`scheduledStartTime` AS STRING) AS `scheduledStartTime`\n  , cast(`sourceContext`\
  \ AS STRING) AS `sourceContext`\n  , cast(`sourceCreatedTime` AS STRING) AS `sourceCreatedTime`\n\
  \  , cast(`sourceCreatedUser` AS STRING) AS `sourceCreatedUser`\n  , cast(`sourceId`\
  \ AS STRING) AS `sourceId`\n  , cast(`sourceUpdatedTime` AS STRING) AS `sourceUpdatedTime`\n\
  \  , cast(`sourceUpdatedUser` AS STRING) AS `sourceUpdatedUser`\n  , cast(`startTime`\
  \ AS STRING) AS `startTime`\n  , cast(`status` AS STRING) AS `status`\n  , cast(`type`\
  \ AS STRING) AS `type`\nFROM `energy_dm_base_demo`.`EnergyNotification`\n"
