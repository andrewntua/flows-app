externalId: tr_energy_base_raw_EnergyTimeSeries_relations
name: RAW → EnergyTimeSeries relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyTimeSeries
    version: v1
  instanceSpace: energy_time_series
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN size(CASE WHEN coalesce(trim(`assetsExternalIds`),\
  \ '') != '' THEN filter(transform(split(`assetsExternalIds`, '\\\\|'), x -> node_reference(trim(`assetsSpace`),\
  \ trim(x))), r -> r.externalId is not null AND length(trim(r.externalId)) > 0) ELSE\
  \ filter(transform(filter(from_json(coalesce(nullif(trim(cast(`assetsJson` AS STRING)),\
  \ ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'), x -> x.externalId\
  \ is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`assetsExternalIds`), '') != '' THEN filter(transform(split(`assetsExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`assetsSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`assetsJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `assets`\n  ,\
  \ CASE WHEN size(CASE WHEN coalesce(trim(`equipmentExternalIds`), '') != '' THEN\
  \ filter(transform(split(`equipmentExternalIds`, '\\\\|'), x -> node_reference(trim(`equipmentSpace`),\
  \ trim(x))), r -> r.externalId is not null AND length(trim(r.externalId)) > 0) ELSE\
  \ filter(transform(filter(from_json(coalesce(nullif(trim(cast(`equipmentJson` AS\
  \ STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'), x ->\
  \ x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`equipmentExternalIds`), '') != '' THEN filter(transform(split(`equipmentExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`equipmentSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`equipmentJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `equipment`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`isStep` AS BOOLEAN)\
  \ AS `isStep`\n  , cast(`name` AS STRING) AS `name`\n  , cast(`sourceId` AS STRING)\
  \ AS `sourceId`\n  , cast(`type` AS STRING) AS `type`\nFROM `energy_dm_base_demo`.`EnergyTimeSeries`\n"
