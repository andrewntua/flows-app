externalId: tr_energy_base_raw_EnergyEquipment_relations
name: RAW → EnergyEquipment relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyEquipment
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`assetExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`assetSpace`), trim(`assetExternalId`))\
  \ END AS `asset`\n  , CASE WHEN coalesce(trim(`equipmentTypeExternalId`), '') =\
  \ '' THEN NULL ELSE node_reference(trim(`equipmentTypeSpace`), trim(`equipmentTypeExternalId`))\
  \ END AS `equipmentType`\n  , CASE WHEN size(CASE WHEN coalesce(trim(`filesExternalIds`),\
  \ '') != '' THEN filter(transform(split(`filesExternalIds`, '\\\\|'), x -> node_reference(trim(`filesSpace`),\
  \ trim(x))), r -> r.externalId is not null AND length(trim(r.externalId)) > 0) ELSE\
  \ filter(transform(filter(from_json(coalesce(nullif(trim(cast(`filesJson` AS STRING)),\
  \ ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'), x -> x.externalId\
  \ is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE slice(CASE\
  \ WHEN coalesce(trim(`filesExternalIds`), '') != '' THEN filter(transform(split(`filesExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`filesSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`filesJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END, 1, 100) END AS `files`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`name` AS STRING)\
  \ AS `name`\n  , cast(`sourceId` AS STRING) AS `sourceId`\nFROM `energy_dm_base_demo`.`EnergyEquipment`\n"
