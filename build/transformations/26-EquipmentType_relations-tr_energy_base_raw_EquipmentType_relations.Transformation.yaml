externalId: tr_energy_base_raw_EquipmentType_relations
name: RAW → EquipmentType relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EquipmentType
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`classExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`classSpace`), trim(`classExternalId`))\
  \ END AS `class`\n  , cast(`description` AS STRING) AS `description`\n  , cast(`name`\
  \ AS STRING) AS `name`\nFROM `energy_dm_base_demo`.`EquipmentType`\n"
