externalId: tr_energy_base_raw_EnergyMaintenanceOrder_nodes
name: RAW → EnergyMaintenanceOrder nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyMaintenanceOrder
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , CASE WHEN `activeMaintenanceTime`\
  \ IS NOT NULL AND trim(cast(`activeMaintenanceTime` AS STRING)) != '' THEN cast(`activeMaintenanceTime`\
  \ AS DOUBLE) ELSE NULL END AS `activeMaintenanceTime`\n  , CASE WHEN `actualCosts`\
  \ IS NOT NULL AND trim(cast(`actualCosts` AS STRING)) != '' THEN cast(`actualCosts`\
  \ AS DOUBLE) ELSE NULL END AS `actualCosts`\n  , CASE WHEN `actualFinishDate` IS\
  \ NOT NULL AND trim(cast(`actualFinishDate` AS STRING)) != '' THEN to_timestamp(`actualFinishDate`)\
  \ ELSE NULL END AS `actualFinishDate`\n  , CASE WHEN `actualStartDate` IS NOT NULL\
  \ AND trim(cast(`actualStartDate` AS STRING)) != '' THEN to_timestamp(`actualStartDate`)\
  \ ELSE NULL END AS `actualStartDate`\n  , CASE WHEN `actualWorkHours` IS NOT NULL\
  \ AND trim(cast(`actualWorkHours` AS STRING)) != '' THEN cast(`actualWorkHours`\
  \ AS DOUBLE) ELSE NULL END AS `actualWorkHours`\n  , from_json(CASE WHEN typeof(`aliasesJson`)\
  \ = 'string' THEN trim(cast(`aliasesJson` AS STRING)) ELSE trim(to_json(`aliasesJson`))\
  \ END, 'ARRAY<STRING>') AS `aliases`\n  , CASE WHEN `basicFinishDate` IS NOT NULL\
  \ AND trim(cast(`basicFinishDate` AS STRING)) != '' THEN to_timestamp(`basicFinishDate`)\
  \ ELSE NULL END AS `basicFinishDate`\n  , CASE WHEN `basicStartDate` IS NOT NULL\
  \ AND trim(cast(`basicStartDate` AS STRING)) != '' THEN to_timestamp(`basicStartDate`)\
  \ ELSE NULL END AS `basicStartDate`\n  , cast(`costCenter` AS STRING) AS `costCenter`\n\
  \  , cast(`currency` AS STRING) AS `currency`\n  , cast(`description` AS STRING)\
  \ AS `description`\n  , cast(`endTime` AS STRING) AS `endTime`\n  , cast(`equipmentNumber`\
  \ AS STRING) AS `equipmentNumber`\n  , cast(`functionalLocation` AS STRING) AS `functionalLocation`\n\
  \  , cast(`maintenanceActivityType` AS STRING) AS `maintenanceActivityType`\n  ,\
  \ cast(`maintenanceCallCategory` AS STRING) AS `maintenanceCallCategory`\n  , cast(`maintenanceCallCategoryDescription`\
  \ AS STRING) AS `maintenanceCallCategoryDescription`\n  , CASE WHEN `maintenanceCallDate`\
  \ IS NOT NULL AND trim(cast(`maintenanceCallDate` AS STRING)) != '' THEN to_timestamp(`maintenanceCallDate`)\
  \ ELSE NULL END AS `maintenanceCallDate`\n  , CASE WHEN `maintenanceCallHorizon`\
  \ IS NOT NULL AND trim(cast(`maintenanceCallHorizon` AS STRING)) != '' THEN cast(`maintenanceCallHorizon`\
  \ AS LONG) ELSE NULL END AS `maintenanceCallHorizon`\n  , cast(`maintenanceCallHorizonUnit`\
  \ AS STRING) AS `maintenanceCallHorizonUnit`\n  , cast(`maintenanceCallLongText`\
  \ AS STRING) AS `maintenanceCallLongText`\n  , cast(`maintenanceCallObject` AS STRING)\
  \ AS `maintenanceCallObject`\n  , cast(`maintenanceCallObjectNumber` AS STRING)\
  \ AS `maintenanceCallObjectNumber`\n  , cast(`maintenanceCallObjectNumberCategory`\
  \ AS STRING) AS `maintenanceCallObjectNumberCategory`\n  , cast(`maintenanceCallObjectNumberCategoryDescription`\
  \ AS STRING) AS `maintenanceCallObjectNumberCategoryDescription`\n  , cast(`maintenanceCallObjectNumberDescription`\
  \ AS STRING) AS `maintenanceCallObjectNumberDescription`\n  , cast(`maintenanceCallObjectNumberSubcategory`\
  \ AS STRING) AS `maintenanceCallObjectNumberSubcategory`\n  , cast(`maintenanceCallObjectNumberSubcategoryDescription`\
  \ AS STRING) AS `maintenanceCallObjectNumberSubcategoryDescription`\n  , cast(`maintenanceCallObjectNumberType`\
  \ AS STRING) AS `maintenanceCallObjectNumberType`\n  , cast(`maintenanceCallObjectNumberTypeDescription`\
  \ AS STRING) AS `maintenanceCallObjectNumberTypeDescription`\n  , cast(`maintenanceCallObjectType`\
  \ AS STRING) AS `maintenanceCallObjectType`\n  , cast(`maintenanceCallObjectTypeDescription`\
  \ AS STRING) AS `maintenanceCallObjectTypeDescription`\n  , cast(`maintenanceCallPerson`\
  \ AS STRING) AS `maintenanceCallPerson`\n  , cast(`maintenanceCallPriority` AS STRING)\
  \ AS `maintenanceCallPriority`\n  , cast(`maintenanceCallPriorityDescription` AS\
  \ STRING) AS `maintenanceCallPriorityDescription`\n  , cast(`maintenanceCallStatus`\
  \ AS STRING) AS `maintenanceCallStatus`\n  , cast(`maintenanceCallStatusDescription`\
  \ AS STRING) AS `maintenanceCallStatusDescription`\n  , cast(`maintenanceCallSubcategory`\
  \ AS STRING) AS `maintenanceCallSubcategory`\n  , cast(`maintenanceCallSubcategoryDescription`\
  \ AS STRING) AS `maintenanceCallSubcategoryDescription`\n  , cast(`maintenanceCallText`\
  \ AS STRING) AS `maintenanceCallText`\n  , cast(`maintenanceCallTime` AS STRING)\
  \ AS `maintenanceCallTime`\n  , cast(`maintenanceCallType` AS STRING) AS `maintenanceCallType`\n\
  \  , cast(`maintenanceCallTypeDescription` AS STRING) AS `maintenanceCallTypeDescription`\n\
  \  , cast(`maintenanceItem` AS STRING) AS `maintenanceItem`\n  , cast(`maintenancePackage`\
  \ AS STRING) AS `maintenancePackage`\n  , cast(`maintenancePlan` AS STRING) AS `maintenancePlan`\n\
  \  , cast(`maintenancePlanningGroup` AS STRING) AS `maintenancePlanningGroup`\n\
  \  , cast(`maintenancePlant` AS STRING) AS `maintenancePlant`\n  , cast(`maintenanceStrategy`\
  \ AS STRING) AS `maintenanceStrategy`\n  , cast(`maintenanceType` AS STRING) AS\
  \ `maintenanceType`\n  , cast(`name` AS STRING) AS `name`\n  , cast(`notificationNumber`\
  \ AS STRING) AS `notificationNumber`\n  , cast(`orderCategory` AS STRING) AS `orderCategory`\n\
  \  , cast(`orderLongText` AS STRING) AS `orderLongText`\n  , cast(`orderNumber`\
  \ AS STRING) AS `orderNumber`\n  , cast(`orderSubcategory` AS STRING) AS `orderSubcategory`\n\
  \  , cast(`orderText` AS STRING) AS `orderText`\n  , cast(`orderType` AS STRING)\
  \ AS `orderType`\n  , CASE WHEN `plannedCosts` IS NOT NULL AND trim(cast(`plannedCosts`\
  \ AS STRING)) != '' THEN cast(`plannedCosts` AS DOUBLE) ELSE NULL END AS `plannedCosts`\n\
  \  , CASE WHEN `plannedWorkHours` IS NOT NULL AND trim(cast(`plannedWorkHours` AS\
  \ STRING)) != '' THEN cast(`plannedWorkHours` AS DOUBLE) ELSE NULL END AS `plannedWorkHours`\n\
  \  , cast(`plannerGroup` AS STRING) AS `plannerGroup`\n  , cast(`planningPlant`\
  \ AS STRING) AS `planningPlant`\n  , cast(`plant` AS STRING) AS `plant`\n  , cast(`priority`\
  \ AS STRING) AS `priority`\n  , cast(`scheduledEndTime` AS STRING) AS `scheduledEndTime`\n\
  \  , CASE WHEN `scheduledFinishDate` IS NOT NULL AND trim(cast(`scheduledFinishDate`\
  \ AS STRING)) != '' THEN to_timestamp(`scheduledFinishDate`) ELSE NULL END AS `scheduledFinishDate`\n\
  \  , CASE WHEN `scheduledStartDate` IS NOT NULL AND trim(cast(`scheduledStartDate`\
  \ AS STRING)) != '' THEN to_timestamp(`scheduledStartDate`) ELSE NULL END AS `scheduledStartDate`\n\
  \  , cast(`scheduledStartTime` AS STRING) AS `scheduledStartTime`\n  , cast(`sourceContext`\
  \ AS STRING) AS `sourceContext`\n  , cast(`sourceCreatedTime` AS STRING) AS `sourceCreatedTime`\n\
  \  , cast(`sourceCreatedUser` AS STRING) AS `sourceCreatedUser`\n  , cast(`sourceId`\
  \ AS STRING) AS `sourceId`\n  , cast(`sourceUpdatedTime` AS STRING) AS `sourceUpdatedTime`\n\
  \  , cast(`sourceUpdatedUser` AS STRING) AS `sourceUpdatedUser`\n  , cast(`startTime`\
  \ AS STRING) AS `startTime`\n  , cast(`status` AS STRING) AS `status`\n  , CASE\
  \ WHEN `suggestedScheduledFinishDate` IS NOT NULL AND trim(cast(`suggestedScheduledFinishDate`\
  \ AS STRING)) != '' THEN to_timestamp(`suggestedScheduledFinishDate`) ELSE NULL\
  \ END AS `suggestedScheduledFinishDate`\n  , CASE WHEN `suggestedScheduledStartDate`\
  \ IS NOT NULL AND trim(cast(`suggestedScheduledStartDate` AS STRING)) != '' THEN\
  \ to_timestamp(`suggestedScheduledStartDate`) ELSE NULL END AS `suggestedScheduledStartDate`\n\
  \  , cast(`systemStatus` AS STRING) AS `systemStatus`\n  , from_json(CASE WHEN typeof(`tagsJson`)\
  \ = 'string' THEN trim(cast(`tagsJson` AS STRING)) ELSE trim(to_json(`tagsJson`))\
  \ END, 'ARRAY<STRING>') AS `tags`\n  , cast(`type` AS STRING) AS `type`\n  , cast(`userStatus`\
  \ AS STRING) AS `userStatus`\n  , cast(`workCenter` AS STRING) AS `workCenter`\n\
  \  , cast(`workCenterResponsible` AS STRING) AS `workCenterResponsible`\nFROM `energy_dm_base_demo`.`EnergyMaintenanceOrder`\n"
