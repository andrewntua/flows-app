query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , cast(`inCuiWindow` AS BOOLEAN) AS\
  \ `inCuiWindow`\n  , cast(`inspectNextCmlId` AS STRING) AS `inspectNextCmlId`\n\
  \  , cast(`insulated` AS BOOLEAN) AS `insulated`\n  , cast(`modelName` AS STRING)\
  \ AS `modelName`\n  , cast(`modelVersion` AS STRING) AS `modelVersion`\n  , CASE\
  \ WHEN `nObservations` IS NOT NULL AND trim(cast(`nObservations` AS STRING)) !=\
  \ '' THEN cast(`nObservations` AS LONG) ELSE NULL END AS `nObservations`\n  , cast(`name`\
  \ AS STRING) AS `name`\n  , CASE WHEN `operatingTempC` IS NOT NULL AND trim(cast(`operatingTempC`\
  \ AS STRING)) != '' THEN cast(`operatingTempC` AS DOUBLE) ELSE NULL END AS `operatingTempC`\n\
  \  , cast(`posteriorSource` AS STRING) AS `posteriorSource`\n  , CASE WHEN `predictedAt`\
  \ IS NOT NULL AND trim(cast(`predictedAt` AS STRING)) != '' THEN to_timestamp(`predictedAt`)\
  \ ELSE NULL END AS `predictedAt`\n  , CASE WHEN `predictedRateMmPerYr` IS NOT NULL\
  \ AND trim(cast(`predictedRateMmPerYr` AS STRING)) != '' THEN cast(`predictedRateMmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `predictedRateMmPerYr`\n  , CASE WHEN `rateP10MmPerYr`\
  \ IS NOT NULL AND trim(cast(`rateP10MmPerYr` AS STRING)) != '' THEN cast(`rateP10MmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `rateP10MmPerYr`\n  , CASE WHEN `rateP50MmPerYr` IS\
  \ NOT NULL AND trim(cast(`rateP50MmPerYr` AS STRING)) != '' THEN cast(`rateP50MmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `rateP50MmPerYr`\n  , CASE WHEN `rateP90MmPerYr` IS\
  \ NOT NULL AND trim(cast(`rateP90MmPerYr` AS STRING)) != '' THEN cast(`rateP90MmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `rateP90MmPerYr`\n  , CASE WHEN `rateStdMmPerYr` IS\
  \ NOT NULL AND trim(cast(`rateStdMmPerYr` AS STRING)) != '' THEN cast(`rateStdMmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `rateStdMmPerYr`\n  , CASE WHEN `registerRateMmPerYr`\
  \ IS NOT NULL AND trim(cast(`registerRateMmPerYr` AS STRING)) != '' THEN cast(`registerRateMmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `registerRateMmPerYr`\n  , CASE WHEN `remainingLifeP10Yr`\
  \ IS NOT NULL AND trim(cast(`remainingLifeP10Yr` AS STRING)) != '' THEN cast(`remainingLifeP10Yr`\
  \ AS DOUBLE) ELSE NULL END AS `remainingLifeP10Yr`\n  , CASE WHEN `remainingLifeP50Yr`\
  \ IS NOT NULL AND trim(cast(`remainingLifeP50Yr` AS STRING)) != '' THEN cast(`remainingLifeP50Yr`\
  \ AS DOUBLE) ELSE NULL END AS `remainingLifeP50Yr`\n  , CASE WHEN `remainingLifeP90Yr`\
  \ IS NOT NULL AND trim(cast(`remainingLifeP90Yr` AS STRING)) != '' THEN cast(`remainingLifeP90Yr`\
  \ AS DOUBLE) ELSE NULL END AS `remainingLifeP90Yr`\n  , cast(`sourceContext` AS\
  \ STRING) AS `sourceContext`\n  , cast(`sourceId` AS STRING) AS `sourceId`\n  ,\
  \ cast(`sourcePipingKey` AS STRING) AS `sourcePipingKey`\n  , cast(`uncertaintyFlag`\
  \ AS STRING) AS `uncertaintyFlag`\n  , CASE WHEN `valueOfInformation` IS NOT NULL\
  \ AND trim(cast(`valueOfInformation` AS STRING)) != '' THEN cast(`valueOfInformation`\
  \ AS DOUBLE) ELSE NULL END AS `valueOfInformation`\nFROM `energy_dm_base_demo`.`PipingCorrosionInference`\n"
