externalId: tr_energy_base_raw_EquipmentType_nodes
name: RAW → EquipmentType nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EquipmentType
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , from_json(CASE WHEN typeof(`aliasesJson`)\
  \ = 'string' THEN trim(cast(`aliasesJson` AS STRING)) ELSE trim(to_json(`aliasesJson`))\
  \ END, 'ARRAY<STRING>') AS `aliases`\n  , cast(`description` AS STRING) AS `description`\n\
  \  , cast(`name` AS STRING) AS `name`\n  , from_json(CASE WHEN typeof(`tagsJson`)\
  \ = 'string' THEN trim(cast(`tagsJson` AS STRING)) ELSE trim(to_json(`tagsJson`))\
  \ END, 'ARRAY<STRING>') AS `tags`\nFROM `energy_dm_base_demo`.`EquipmentType`\n"
