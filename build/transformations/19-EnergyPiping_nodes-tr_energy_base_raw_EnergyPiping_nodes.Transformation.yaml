externalId: tr_energy_base_raw_EnergyPiping_nodes
name: RAW → EnergyPiping nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyPiping
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , cast(`area` AS STRING) AS `area`\n\
  \  , cast(`avevaDirectUrl` AS STRING) AS `avevaDirectUrl`\n  , cast(`categoryCode`\
  \ AS STRING) AS `categoryCode`\n  , cast(`classId` AS STRING) AS `classId`\n  ,\
  \ cast(`className` AS STRING) AS `className`\n  , cast(`cofCategory` AS STRING)\
  \ AS `cofCategory`\n  , cast(`compressibilityFactorZ` AS STRING) AS `compressibilityFactorZ`\n\
  \  , cast(`corrosionAllowance` AS STRING) AS `corrosionAllowance`\n  , CASE WHEN\
  \ `corrosionRateMmPerYr` IS NOT NULL AND trim(cast(`corrosionRateMmPerYr` AS STRING))\
  \ != '' THEN cast(`corrosionRateMmPerYr` AS DOUBLE) ELSE NULL END AS `corrosionRateMmPerYr`\n\
  \  , cast(`currentSchedule` AS STRING) AS `currentSchedule`\n  , cast(`deferralOpportunity`\
  \ AS BOOLEAN) AS `deferralOpportunity`\n  , cast(`densityGas` AS STRING) AS `densityGas`\n\
  \  , cast(`densityGasUom` AS STRING) AS `densityGasUom`\n  , cast(`densityLiquid`\
  \ AS STRING) AS `densityLiquid`\n  , cast(`densityLiquidUom` AS STRING) AS `densityLiquidUom`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`designPressureMax`\
  \ AS STRING) AS `designPressureMax`\n  , cast(`designPressureMaxUom` AS STRING)\
  \ AS `designPressureMaxUom`\n  , cast(`designTemperatureMax` AS STRING) AS `designTemperatureMax`\n\
  \  , cast(`designTemperatureMaxUom` AS STRING) AS `designTemperatureMaxUom`\n  ,\
  \ cast(`designTemperatureMin` AS STRING) AS `designTemperatureMin`\n  , cast(`designTemperatureMinUom`\
  \ AS STRING) AS `designTemperatureMinUom`\n  , cast(`facility` AS STRING) AS `facility`\n\
  \  , cast(`fromTag` AS STRING) AS `fromTag`\n  , cast(`functionCode` AS STRING)\
  \ AS `functionCode`\n  , cast(`functionCodeDescription` AS STRING) AS `functionCodeDescription`\n\
  \  , cast(`insulated` AS BOOLEAN) AS `insulated`\n  , cast(`insulationClass` AS\
  \ STRING) AS `insulationClass`\n  , cast(`insulationCondition` AS STRING) AS `insulationCondition`\n\
  \  , cast(`insulationThickness` AS STRING) AS `insulationThickness`\n  , cast(`insulationThicknessUom`\
  \ AS STRING) AS `insulationThicknessUom`\n  , cast(`insulationType` AS STRING) AS\
  \ `insulationType`\n  , cast(`iowTempThresholdMax` AS STRING) AS `iowTempThresholdMax`\n\
  \  , cast(`iowTempThresholdMin` AS STRING) AS `iowTempThresholdMin`\n  , cast(`lineNumber`\
  \ AS STRING) AS `lineNumber`\n  , cast(`lineServiceCode` AS STRING) AS `lineServiceCode`\n\
  \  , cast(`liquidFraction` AS STRING) AS `liquidFraction`\n  , cast(`massFlow` AS\
  \ STRING) AS `massFlow`\n  , cast(`massFlowUom` AS STRING) AS `massFlowUom`\n  ,\
  \ cast(`name` AS STRING) AS `name`\n  , cast(`ndtTestClass` AS STRING) AS `ndtTestClass`\n\
  \  , cast(`nominalDiameter` AS STRING) AS `nominalDiameter`\n  , cast(`nominalDiameterUom`\
  \ AS STRING) AS `nominalDiameterUom`\n  , cast(`objectId` AS STRING) AS `objectId`\n\
  \  , cast(`operatingPressureNormal` AS STRING) AS `operatingPressureNormal`\n  ,\
  \ cast(`operatingPressureNormalUom` AS STRING) AS `operatingPressureNormalUom`\n\
  \  , cast(`operatingTemperatureMin` AS STRING) AS `operatingTemperatureMin`\n  ,\
  \ cast(`operatingTemperatureMinUom` AS STRING) AS `operatingTemperatureMinUom`\n\
  \  , cast(`originalInsulationDate` AS STRING) AS `originalInsulationDate`\n  , cast(`parentTag`\
  \ AS STRING) AS `parentTag`\n  , cast(`pipeSchedule` AS STRING) AS `pipeSchedule`\n\
  \  , cast(`pipingSpecificationClass` AS STRING) AS `pipingSpecificationClass`\n\
  \  , cast(`platformCode` AS STRING) AS `platformCode`\n  , cast(`pofCategory` AS\
  \ STRING) AS `pofCategory`\n  , cast(`potentialIgnitionSource1` AS STRING) AS `potentialIgnitionSource1`\n\
  \  , cast(`potentialIgnitionSource2` AS STRING) AS `potentialIgnitionSource2`\n\
  \  , cast(`potentialIgnitionSource3` AS STRING) AS `potentialIgnitionSource3`\n\
  \  , cast(`potentialIgnitionSource4` AS STRING) AS `potentialIgnitionSource4`\n\
  \  , cast(`potentialIgnitionSourceRemark` AS STRING) AS `potentialIgnitionSourceRemark`\n\
  \  , cast(`priorAssessmentDate` AS STRING) AS `priorAssessmentDate`\n  , cast(`priorCofCategory`\
  \ AS STRING) AS `priorCofCategory`\n  , cast(`priorInsulationAge` AS STRING) AS\
  \ `priorInsulationAge`\n  , cast(`priorOperatingTemperature` AS STRING) AS `priorOperatingTemperature`\n\
  \  , cast(`priorPofCategory` AS STRING) AS `priorPofCategory`\n  , cast(`priorRiskRank`\
  \ AS STRING) AS `priorRiskRank`\n  , cast(`recommendedNextInspection` AS STRING)\
  \ AS `recommendedNextInspection`\n  , cast(`remarks` AS STRING) AS `remarks`\n \
  \ , cast(`riskChanged` AS BOOLEAN) AS `riskChanged`\n  , cast(`riskRank` AS STRING)\
  \ AS `riskRank`\n  , cast(`sapCatalogProfile` AS STRING) AS `sapCatalogProfile`\n\
  \  , cast(`sapExportFlag` AS STRING) AS `sapExportFlag`\n  , cast(`sapObjectType`\
  \ AS STRING) AS `sapObjectType`\n  , cast(`sourceContext` AS STRING) AS `sourceContext`\n\
  \  , cast(`sourceId` AS STRING) AS `sourceId`\n  , cast(`state` AS STRING) AS `state`\n\
  \  , cast(`system` AS STRING) AS `system`\n  , cast(`tagDiscipline` AS STRING) AS\
  \ `tagDiscipline`\n  , cast(`tagNumber` AS STRING) AS `tagNumber`\n  , cast(`testMedium`\
  \ AS STRING) AS `testMedium`\n  , cast(`testPressure` AS STRING) AS `testPressure`\n\
  \  , cast(`testPressureUom` AS STRING) AS `testPressureUom`\n  , cast(`toTag` AS\
  \ STRING) AS `toTag`\n  , cast(`updatedDate` AS STRING) AS `updatedDate`\n  , cast(`useProjectStatus`\
  \ AS STRING) AS `useProjectStatus`\n  , cast(`velocity` AS STRING) AS `velocity`\n\
  \  , cast(`velocityUom` AS STRING) AS `velocityUom`\n  , cast(`viscosityGas` AS\
  \ STRING) AS `viscosityGas`\n  , cast(`viscosityGasUom` AS STRING) AS `viscosityGasUom`\n\
  \  , cast(`viscosityLiquid` AS STRING) AS `viscosityLiquid`\n  , cast(`viscosityLiquidUom`\
  \ AS STRING) AS `viscosityLiquidUom`\n  , cast(`wallThickness` AS STRING) AS `wallThickness`\n\
  \  , cast(`wallThicknessUom` AS STRING) AS `wallThicknessUom`\n  , cast(`workflowStatus`\
  \ AS STRING) AS `workflowStatus`\nFROM `energy_dm_base_demo`.`EnergyPiping`\n"
