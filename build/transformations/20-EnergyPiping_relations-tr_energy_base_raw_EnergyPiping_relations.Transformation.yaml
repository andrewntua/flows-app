externalId: tr_energy_base_raw_EnergyPiping_relations
name: RAW → EnergyPiping relations
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyPiping
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: true
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (relations)\n\
  SELECT\n    cast(`key` AS STRING) AS externalId\n  , CASE WHEN coalesce(trim(`assetExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`assetSpace`), trim(`assetExternalId`))\
  \ END AS `asset`\n  , CASE WHEN coalesce(trim(`corrosionLoopExternalId`), '') =\
  \ '' THEN NULL ELSE node_reference(trim(`corrosionLoopSpace`), trim(`corrosionLoopExternalId`))\
  \ END AS `corrosionLoop`\n  , CASE WHEN size(CASE WHEN coalesce(trim(`damageMechanismsExternalIds`),\
  \ '') != '' THEN filter(transform(split(`damageMechanismsExternalIds`, '\\\\|'),\
  \ x -> node_reference(trim(`damageMechanismsSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`damageMechanismsJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`damageMechanismsExternalIds`), '') != '' THEN filter(transform(split(`damageMechanismsExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`damageMechanismsSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`damageMechanismsJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `damageMechanisms`\n\
  \  , CASE WHEN size(CASE WHEN coalesce(trim(`documentsExternalIds`), '') != '' THEN\
  \ filter(transform(split(`documentsExternalIds`, '\\\\|'), x -> node_reference(trim(`documentsSpace`),\
  \ trim(x))), r -> r.externalId is not null AND length(trim(r.externalId)) > 0) ELSE\
  \ filter(transform(filter(from_json(coalesce(nullif(trim(cast(`documentsJson` AS\
  \ STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'), x ->\
  \ x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`documentsExternalIds`), '') != '' THEN filter(transform(split(`documentsExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`documentsSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`documentsJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `documents`\n\
  \  , CASE WHEN coalesce(trim(`fromAssetExternalId`), '') = '' THEN NULL ELSE node_reference(trim(`fromAssetSpace`),\
  \ trim(`fromAssetExternalId`)) END AS `fromAsset`\n  , CASE WHEN coalesce(trim(`materialExternalId`),\
  \ '') = '' THEN NULL ELSE node_reference(trim(`materialSpace`), trim(`materialExternalId`))\
  \ END AS `material`\n  , CASE WHEN size(CASE WHEN coalesce(trim(`timeSeriesExternalIds`),\
  \ '') != '' THEN filter(transform(split(`timeSeriesExternalIds`, '\\\\|'), x ->\
  \ node_reference(trim(`timeSeriesSpace`), trim(x))), r -> r.externalId is not null\
  \ AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`timeSeriesJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END) = 0 THEN NULL ELSE CASE\
  \ WHEN coalesce(trim(`timeSeriesExternalIds`), '') != '' THEN filter(transform(split(`timeSeriesExternalIds`,\
  \ '\\\\|'), x -> node_reference(trim(`timeSeriesSpace`), trim(x))), r -> r.externalId\
  \ is not null AND length(trim(r.externalId)) > 0) ELSE filter(transform(filter(from_json(coalesce(nullif(trim(cast(`timeSeriesJson`\
  \ AS STRING)), ''), '[]'), 'ARRAY<STRUCT<space: STRING, externalId: STRING>>'),\
  \ x -> x.externalId is not null AND length(trim(x.externalId)) > 0), x -> node_reference(x.space,\
  \ x.externalId)), r -> length(trim(r.externalId)) > 0) END END AS `timeSeries`\n\
  \  , CASE WHEN coalesce(trim(`toAssetExternalId`), '') = '' THEN NULL ELSE node_reference(trim(`toAssetSpace`),\
  \ trim(`toAssetExternalId`)) END AS `toAsset`\n  , cast(`description` AS STRING)\
  \ AS `description`\n  , cast(`name` AS STRING) AS `name`\n  , cast(`sourceContext`\
  \ AS STRING) AS `sourceContext`\n  , cast(`sourceId` AS STRING) AS `sourceId`\n\
  FROM `energy_dm_base_demo`.`EnergyPiping`\n"
