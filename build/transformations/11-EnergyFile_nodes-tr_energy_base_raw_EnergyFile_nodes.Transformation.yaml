externalId: tr_energy_base_raw_EnergyFile_nodes
name: RAW → EnergyFile nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: EnergyFile
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , cast(`area` AS STRING) AS `area`\n\
  \  , cast(`description` AS STRING) AS `description`\n  , cast(`disciplineCode` AS\
  \ STRING) AS `disciplineCode`\n  , cast(`isUploaded` AS BOOLEAN) AS `isUploaded`\n\
  \  , CASE WHEN `issueDate` IS NOT NULL AND trim(cast(`issueDate` AS STRING)) !=\
  \ '' THEN to_timestamp(`issueDate`) ELSE NULL END AS `issueDate`\n  , cast(`latest`\
  \ AS BOOLEAN) AS `latest`\n  , cast(`mimeType` AS STRING) AS `mimeType`\n  , cast(`name`\
  \ AS STRING) AS `name`\n  , cast(`revision` AS STRING) AS `revision`\n  , cast(`revisionRemark`\
  \ AS STRING) AS `revisionRemark`\n  , cast(`system` AS STRING) AS `system`\n  ,\
  \ CASE WHEN `updatedDate` IS NOT NULL AND trim(cast(`updatedDate` AS STRING)) !=\
  \ '' THEN to_timestamp(`updatedDate`) ELSE NULL END AS `updatedDate`\n  , cast(`uploadedTime`\
  \ AS STRING) AS `uploadedTime`\n  , cast(`workflowStatus` AS STRING) AS `workflowStatus`\n\
  FROM `energy_dm_base_demo`.`EnergyFile`\n"
