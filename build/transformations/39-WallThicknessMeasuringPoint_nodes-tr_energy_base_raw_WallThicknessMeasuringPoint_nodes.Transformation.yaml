externalId: tr_energy_base_raw_WallThicknessMeasuringPoint_nodes
name: RAW → WallThicknessMeasuringPoint nodes
destination:
  type: nodes
  view:
    space: energy_dm
    externalId: WallThicknessMeasuringPoint
    version: v1
  instanceSpace: energy_instances
dataSetExternalId: ds_energy_base_raw_ingestion
ignoreNullFields: false
conflictMode: upsert
query: "-- Generated by tk/scripts/build_energy_base_raw_from_cdf.py (nodes)\nSELECT\n\
  \    cast(`key` AS STRING) AS externalId\n  , CASE WHEN `corrosionRateMmPerYr` IS\
  \ NOT NULL AND trim(cast(`corrosionRateMmPerYr` AS STRING)) != '' THEN cast(`corrosionRateMmPerYr`\
  \ AS DOUBLE) ELSE NULL END AS `corrosionRateMmPerYr`\n  , cast(`findings` AS STRING)\
  \ AS `findings`\n  , CASE WHEN `inspectionDate` IS NOT NULL AND trim(cast(`inspectionDate`\
  \ AS STRING)) != '' THEN to_timestamp(`inspectionDate`) ELSE NULL END AS `inspectionDate`\n\
  \  , cast(`inspectionEffectiveness` AS STRING) AS `inspectionEffectiveness`\n  ,\
  \ cast(`measuredBy` AS STRING) AS `measuredBy`\n  , CASE WHEN `measuredThicknessMm`\
  \ IS NOT NULL AND trim(cast(`measuredThicknessMm` AS STRING)) != '' THEN cast(`measuredThicknessMm`\
  \ AS DOUBLE) ELSE NULL END AS `measuredThicknessMm`\n  , cast(`measurementId` AS\
  \ STRING) AS `measurementId`\n  , cast(`name` AS STRING) AS `name`\n  , CASE WHEN\
  \ `positionX` IS NOT NULL AND trim(cast(`positionX` AS STRING)) != '' THEN cast(`positionX`\
  \ AS DOUBLE) ELSE NULL END AS `positionX`\n  , CASE WHEN `positionY` IS NOT NULL\
  \ AND trim(cast(`positionY` AS STRING)) != '' THEN cast(`positionY` AS DOUBLE) ELSE\
  \ NULL END AS `positionY`\n  , CASE WHEN `positionZ` IS NOT NULL AND trim(cast(`positionZ`\
  \ AS STRING)) != '' THEN cast(`positionZ` AS DOUBLE) ELSE NULL END AS `positionZ`\n\
  \  , cast(`technique` AS STRING) AS `technique`\nFROM `energy_dm_base_demo`.`WallThicknessMeasuringPoint`\n"
