space: energy_dm
externalId: Material
name: Material
description: Piping or equipment material grade for RBI and engineering.
properties:
  coated:
    type:
      list: false
      type: boolean
    immutable: false
    nullable: true
    autoIncrement: false
    name: Coated
    description: Whether the material surface has an applied coating (e.g. paint or
      metallic cladding).
  cuiSusceptibilityMinC:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: CUI Susceptibility Min (°C)
    description: Lower bound of the CUI susceptibility temperature window for this
      material (°C), per API 571 / API 583 style guidance.
  cuiSusceptibilityMaxC:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: CUI Susceptibility Max (°C)
    description: Upper bound of the CUI susceptibility temperature window for this
      material (°C).
  cuiPeakMinC:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: CUI Peak Min (°C)
    description: Lower bound of the peak CUI risk temperature band for this material
      (°C) — highest corrosion rate (CS) or Cl-SCC likelihood (SS/duplex).
  cuiPeakMaxC:
    type:
      list: false
      type: float64
    immutable: false
    nullable: true
    autoIncrement: false
    name: CUI Peak Max (°C)
    description: Upper bound of the peak CUI risk temperature band for this material
      (°C).
constraints:
  cdf_cdm_CogniteDescribable:
    require:
      space: cdf_cdm
      externalId: CogniteDescribable
      type: container
    constraintType: requires
