space: energy_dm
externalId: EnergyEquipment
name: Equipment
description: 'Equipment specific to energy industry operations, extending CogniteEquipment
  with energy-specific fields.

  @name Equipment'
implements:
- space: cdf_cdm
  externalId: CogniteSourceable
  version: v1
  type: view
- space: cdf_cdm
  externalId: CogniteDescribable
  version: v1
  type: view
- space: cdf_cdm
  externalId: CogniteEquipment
  version: v1
  type: view
version: v1
properties:
  asset:
    container:
      space: cdf_cdm
      externalId: CogniteEquipment
      type: container
    containerPropertyIdentifier: asset
    name: Asset
    description: 'The asset the equipment is related to.

      @name Asset'
    source:
      space: energy_dm
      externalId: EnergyAsset
      version: v1
      type: view
  files:
    container:
      space: cdf_cdm
      externalId: CogniteEquipment
      type: container
    containerPropertyIdentifier: files
    name: Files
    description: 'A list of files the equipment relates to.

      @name Files'
    source:
      space: energy_dm
      externalId: EnergyFile
      version: v1
      type: view
  equipmentType:
    container:
      space: cdf_cdm
      externalId: CogniteEquipment
      type: container
    containerPropertyIdentifier: equipmentType
    name: Equipment Type
    description: 'The type of the equipment.

      @name Equipment Type'
    source:
      space: energy_dm
      externalId: EquipmentType
      version: v1
      type: view
  timeSeries:
    source:
      space: energy_dm
      externalId: EnergyTimeSeries
      version: v1
      type: view
    through:
      source:
        space: energy_dm
        externalId: EnergyTimeSeries
        version: v1
        type: view
      identifier: equipment
    name: Time series
    description: 'An automatically updated list of time series related to the equipment.

      @name Time series'
    connectionType: multi_reverse_direct_relation
  maintenanceOrders:
    source:
      space: energy_dm
      externalId: EnergyMaintenanceOrder
      version: v1
      type: view
    through:
      source:
        space: energy_dm
        externalId: EnergyMaintenanceOrder
        version: v1
        type: view
      identifier: equipment
    name: Maintenance Orders
    description: 'An automatically updated list of maintenance orders related to this
