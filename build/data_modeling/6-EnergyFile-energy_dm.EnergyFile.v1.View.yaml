space: energy_dm
externalId: EnergyFile
name: Files
description: 'A file specific to energy industry operations, extending CogniteFile
  with energy-specific fields.

  @name Files'
implements:
- space: cdf_cdm
  externalId: CogniteSourceable
  version: v1
  type: view
- space: cdf_cdm
  externalId: CogniteDescribable
  version: v1
  type: view
- space: cdf_cdm
  externalId: CogniteFile
  version: v1
  type: view
version: v1
properties:
  assets:
    container:
      space: cdf_cdm
      externalId: CogniteFile
      type: container
    containerPropertyIdentifier: assets
    name: Assets
    description: 'A list of assets this file is related to.

      @name Assets'
    source:
      space: energy_dm
      externalId: EnergyAsset
      version: v1
      type: view
  equipment:
    source:
      space: energy_dm
      externalId: EnergyEquipment
      version: v1
      type: view
    through:
      source:
        space: energy_dm
        externalId: EnergyEquipment
        version: v1
        type: view
      identifier: files
    name: Equipment
    description: 'An automatically updated list of equipment this file is related
      to.

      @name Equipment'
    connectionType: multi_reverse_direct_relation
  piping:
    source:
      space: energy_dm
      externalId: EnergyPiping
      version: v1
      type: view
    through:
      source:
        space: energy_dm
        externalId: EnergyPiping
        version: v1
        type: view
      identifier: documents
    name: Piping
    description: An automatically updated list of piping lines related to this file.
    connectionType: multi_reverse_direct_relation
  revision:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: revision
    name: revision
    description: The revision version of this particular document. @name Revision
  latest:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: latest
    name: latest
    description: Boolean indicating whether this is the latest revision of this document.
      @name Latest
  disciplineCode:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: disciplineCode
    name: disciplineCode
    description: A code indicating particular discipline, e.g. P for Process, and
      O for Operations. @name Discipline Code
  area:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: area
    name: area
    description: The area that the document concerns. @name Area
  system:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: system
    name: system
    description: The system that the document concerns, e.g, System 20 Oil export
      system. @name System
  issueDate:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: issueDate
    name: issueDate
    description: The date when the document was issued. @name Issue Date
  updatedDate:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: updatedDate
    name: updatedDate
    description: The date when the document was last updated. @name Updated Date
  revisionRemark:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: revisionRemark
    name: revisionRemark
    description: Remarks or notes related to the revision of the document. @name Revision
      Remark
  workflowStatus:
    container:
      space: energy_dm
      externalId: EnergyFile
      type: container
    containerPropertyIdentifier: workflowStatus
    name: workflowStatus
    description: The current status of the document in the workflow process. @name
      Workflow Status
